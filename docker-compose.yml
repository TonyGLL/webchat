# The whole stack from the repository root: `make up-dev` / `make up-prod` (full stack),
# `make infra-up` (only Postgres and Redis, backend and frontend run on the host).
name: webchat

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: webchat/api:0.0.5
    restart: unless-stopped
    container_name: webchat-api
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    environment:
      - CONFIG_FILE=${CONFIG_FILE:-}
      - PORT=8081

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time: the URL the BROWSER uses to reach the API
        # (a production build refuses a non-https remote URL).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api/v1}
    image: webchat/web:0.0.5
    restart: unless-stopped
    container_name: webchat-web
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - app

  db:
    image: postgres:16-alpine  # keep the major: a new one is a data migration
    container_name: webchat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: webchat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: webchat-redis
    # The official image ignores Bitnami-style variables (REDIS_USERNAME, ALLOW_EMPTY_PASSWORD...):
    # the password is only enforced because it is passed to redis-server here. Override it with
    # REDIS_PASSWORD (shell or backend/.env) and keep REDIS_URL in the backend env file in sync.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-s3cr3tP@ss}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
    name: webchat-db-data
  redis_data:
    name: webchat-redis-data
