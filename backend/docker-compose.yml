name: webchat

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - CONFIG_FILE=${CONFIG_FILE}
    image: webchat/api:0.0.5
    restart: unless-stopped
    container_name: webchat-api
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - CONFIG_FILE=${CONFIG_FILE}
      - PORT=8081

  db:
    image: postgres:16-alpine
    container_name: webchat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: webchat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: webchat-redis
    environment:
      - REDIS_PASSWORD=s3cr3tP@ss
      - REDIS_USERNAME=default
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PORT_NUMBER=6379
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
    name: webchat-db-data
  redis_data:
    name: webchat-redis-data
