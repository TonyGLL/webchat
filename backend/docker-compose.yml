services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - CONFIG_FILE=${CONFIG_FILE}
    image: webchat/api:0.0.5
    restart: unless-stopped
    container_name: webchat_api
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - CONFIG_FILE=${CONFIG_FILE}

  db:
    image: postgres:16-alpine
    container_name: webchat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: webchat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    environment:
      - REDIS_PASSWORD=s3cr3tP@ss
      - REDIS_USERNAME=default
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PORT_NUMBER=6379
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
