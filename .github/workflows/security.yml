name: Security

# Dependency advisories change without anyone touching the code, so besides pull requests this
# also runs weekly. It is a separate workflow so a new advisory in a transitive dependency
# does not block unrelated pull requests.
on:
  pull_request:
    paths: ["backend/go.mod", "backend/go.sum", "frontend/pnpm-lock.yaml", "frontend/package.json", ".github/workflows/security.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # govulncheck only reports vulnerabilities in code the program actually calls. The version
      # is pinned (Dependabot cannot see it): bump it by hand now and then.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  js-vulnerabilities:
    name: JavaScript dependencies (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
