name: Security

# Dependency advisories change without anyone touching the code, so besides pull requests this
# also runs weekly. It is a separate workflow so a new advisory in a transitive dependency
# does not block unrelated pull requests.
on:
  pull_request:
    paths: ["backend/go.mod", "backend/go.sum", "frontend/pnpm-lock.yaml", "frontend/package.json", ".github/workflows/security.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # govulncheck only reports vulnerabilities in code the program actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  js-vulnerabilities:
    name: JavaScript dependencies (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
