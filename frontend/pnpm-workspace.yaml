# unrs-resolver (used by eslint) ships prebuilt binaries; its install script is only a fallback.
allowBuilds:
  unrs-resolver: false

# Supply-chain policy. pnpm re-checks every lockfile entry against it on each install, so it also
# applies to `--frozen-lockfile` in CI and in the image.
# A version must be at least one day old (pnpm 11+ default, made explicit so it also turns on strict mode).
minimumReleaseAge: 1440
# Fail when a package loses provenance / trusted publishing compared with an earlier release.
trustPolicy: no-downgrade
# These three are older release lines published after a newer line gained provenance (backports);
# reviewed, not takeovers. Pinned to exact versions so a bump has to be reviewed again.
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - tailwind-merge@2.6.1
# Only direct dependencies may come from git or tarball URLs.
blockExoticSubdeps: true
# Fail the install on a dependency build script nobody reviewed (allowBuilds lists the decisions).
strictDepBuilds: true

overrides:
  # postcss-selector-parser < 7.1.6 has a moderate advisory (build time, via tailwindcss).
  postcss-selector-parser: "^7.1.6"
  # minimatch < 11.0.1 has a moderate ReDoS advisory (lint time, via eslint). Only the 10.x line is
  # raised: its `{ minimatch }` API is unchanged in 11. The 3.x line (eslint-plugin-*) has no patch
  # and its default-function export breaks on 11, so it stays until those plugins move on.
  "minimatch@^10": "^11.0.1"
